<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HábitoTracker</title>
 <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav id="menu">
    <span class="logo">HábitoTracker</span>
    <div class="enlaces">
      <a href="#inicio" id="enlaceInicio">Inicio</a>
      <a href="#" id="enlaceSeguimiento">Ver seguimiento</a>
    </div>
  </nav>

         <section class="tarjeta">
        <h2>Crear un hábito</h2>
        <form id="formHabito" novalidate>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Ej: Leer 20 minutos">
          <p class="error" id="errorNombre"></p>
 
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="3" placeholder="Opcional"></textarea>
 
          <label for="categoria">Categoría</label>
          <select id="categoria">
            <option value="Salud">Salud</option>
            <option value="Estudio">Estudio</option>
            <option value="Ocio">Ocio</option>
            <option value="Trabajo">Trabajo</option>
            <option value="Otros">Otros</option>
          </select>
 
          <button type="submit" class="btn">Crear hábito</button>
        </form>
      </section>

      </section>
    </div>
 
    <div class="acciones">
      <button type="button" class="btn-peligro" id="btnBorrarTodo">Borrar todo</button>
    </div>
  </main>

    <section class="tarjeta">
        <h2>Registrar un día</h2>
        <form id="formRegistro" novalidate>
          <label for="selectHabito">Hábito</label>
          <select id="selectHabito"></select>
          <p class="error" id="errorHabito"></p>
 
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha">
          <p class="error" id="errorFecha"></p>
 
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" rows="3" placeholder="Opcional"></textarea>
 
          <label class="check">
            <input type="checkbox" id="cumplido">
            <span>Lo he cumplido</span>
          </label>
 
          <button type="submit" class="btn">Guardar registro</button>
        </form>
      </section>
    </div>
 
    <div class="acciones">
      <button type="button" class="btn-peligro" id="btnBorrarTodo">Borrar todo</button>
    </div>
  </main>

    <div class="modal oculto" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-caja">
      <div class="modal-cabecera">
        <h2 id="modalTitulo">Seguimiento</h2>
        <button type="button" class="cerrar" id="btnCerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="tabla-scroll">
        <table id="tablaSeguimiento">
          <thead>
            <tr>
              <th>Hábito</th>
              <th>Fecha</th>
              <th>Observaciones</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla"></tbody>
        </table>
      </div>
      <p class="resumen" id="resumenTabla"></p>
    </div>
  </div>

      <section class="panel-stats" aria-label="Resumen">
      <div class="stat">
        <span class="stat-num" id="statHabitos">0</span>
        <span class="stat-txt">hábitos creados</span>
      </div>
      <div class="stat stat-ok">
        <span class="stat-num" id="statCumplidos">0</span>
        <span class="stat-txt">días cumplidos</span>
      </div>
      <div class="stat stat-ko">
        <span class="stat-num" id="statFallados">0</span>
        <span class="stat-txt">días fallados</span>
      </div>
    </section>
 
    <div class="formularios">

  <script src="app.js"></script>
</body>
</html>
